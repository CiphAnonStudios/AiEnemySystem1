<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wall Builder Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #1b1b1b;
      overflow: hidden;
    }

    .wall {
      position: absolute;
      background: #555;
      z-index: 2;
    }

    #topWall {
      top: 0;
      left: 0;
      width: 100%;
      height: 20px;
    }

    #bottomWall {
      bottom: 120px;
      left: 0;
      width: 100%;
      height: 20px;
    }

    #leftWall {
      top: 0;
      left: 0;
      width: 20px;
      height: 100%;
    }

    #rightWall {
      top: 0;
      right: 0;
      width: 20px;
      height: 100%;
    }

    #playArea {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      bottom: 140px;
      overflow: hidden;
    }

    #panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 120px;
      background: #222;
      border-top: 2px solid #444;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      z-index: 10;
    }

    .tool {
      width: 70px;
      height: 70px;
      border: 2px solid white;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .rect-small { width: 40px; height: 25px; background: #ff5c5c; }
    .rect-medium { width: 60px; height: 35px; background: #ffd54a; }
    .rect-large { width: 90px; height: 50px; background: #4fc3f7; }

    .player-tool {
      width: 45px;
      height: 45px;
      background: limegreen;
    }

    .delete-box {
      width: 80px;
      height: 80px;
      background: #222;
      color: white;
      border: 2px dashed white;
    }

    .placedRect {
      position: absolute;
      z-index: 4;
      border: 2px solid rgba(255,255,255,0.7);
    }

    #player {
      position: absolute;
      width: 45px;
      height: 45px;
      background: limegreen;
      border: 2px solid #0a0;
      z-index: 6;
    }

    #aiBall {
      position: absolute;
      width: 40px;
      height: 40px;
      background: deepskyblue;
      border-radius: 50%;
      z-index: 6;
    }

    #sensor {
      position: absolute;
      width: 120px;
      height: 120px;
      border: 2px dashed rgba(0,255,255,0.35);
      border-radius: 50%;
      transform: translate(-40px, -40px);
      pointer-events: none;
    }

    #deleteZone {
      position: absolute;
      right: 20px;
      bottom: 150px;
      width: 100px;
      height: 100px;
      background: rgba(255, 0, 0, 0.25);
      border: 2px solid red;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 11;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="topWall" class="wall"></div>
    <div id="bottomWall" class="wall"></div>
    <div id="leftWall" class="wall"></div>
    <div id="rightWall" class="wall"></div>

    <div id="playArea"></div>
    <div id="deleteZone">DELETE</div>

    <div id="panel">
      <div class="tool rect-small" draggable="true" data-type="small"></div>
      <div class="tool rect-medium" draggable="true" data-type="medium"></div>
      <div class="tool rect-large" draggable="true" data-type="large"></div>
      <div class="tool player-tool" draggable="true" data-type="player"></div>
      <div class="tool delete-box">Delete</div>
    </div>
  </div>

  <script>
    const playArea = document.getElementById("playArea");
    const deleteZone = document.getElementById("deleteZone");

    let draggedType = null;
    let draggedElement = null;
    let player = null;
    let aiBall = null;
    let sensor = null;
    let aiX = 200;
    let aiY = 200;
    let aiVX = 2;
    let aiVY = 2;
    const keys = {};
    const obstacles = [];

    document.querySelectorAll("[draggable='true']").forEach(tool => {
      tool.addEventListener("dragstart", () => {
        draggedType = tool.dataset.type;
        draggedElement = null;
      });
    });

    playArea.addEventListener("dragover", e => e.preventDefault());

    playArea.addEventListener("drop", e => {
      e.preventDefault();
      const rect = playArea.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (draggedType === "small" || draggedType === "medium" || draggedType === "large") {
        createObstacle(draggedType, x, y);
      } else if (draggedType === "player") {
        if (!player) {
          player = document.createElement("div");
          player.id = "player";
          playArea.appendChild(player);
        }
        player.style.left = x + "px";
        player.style.top = y + "px";
      }

      draggedType = null;
    });

    function createObstacle(type, x, y) {
      const div = document.createElement("div");
      div.className = "placedRect";
      div.draggable = true;

      if (type === "small") {
        div.style.width = "40px";
        div.style.height = "25px";
        div.style.background = "#ff5c5c";
      } else if (type === "medium") {
        div.style.width = "60px";
        div.style.height = "35px";
        div.style.background = "#ffd54a";
      } else {
        div.style.width = "90px";
        div.style.height = "50px";
        div.style.background = "#4fc3f7";
      }

      div.style.left = x + "px";
      div.style.top = y + "px";

      div.addEventListener("dragstart", () => {
        draggedElement = div;
      });

      playArea.appendChild(div);
      obstacles.push(div);
    }

    playArea.addEventListener("dragend", () => {
      if (draggedElement) {
        const zone = deleteZone.getBoundingClientRect();
        const box = draggedElement.getBoundingClientRect();

        if (
          box.left < zone.right &&
          box.right > zone.left &&
          box.top < zone.bottom &&
          box.bottom > zone.top
        ) {
          const index = obstacles.indexOf(draggedElement);
          if (index !== -1) obstacles.splice(index, 1);
          draggedElement.remove();
        }
      }
      draggedElement = null;
    });

    document.addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
    });

    document.addEventListener("keyup", e => {
      keys[e.key.toLowerCase()] = false;
    });

    function rectsOverlap(a, b) {
      return !(
        a.right <= b.left ||
        a.left >= b.right ||
        a.bottom <= b.top ||
        a.top >= b.bottom
      );
    }

    function getRect(el, x, y) {
      return {
        left: x,
        top: y,
        right: x + el.offsetWidth,
        bottom: y + el.offsetHeight
      };
    }

    function obstacleRect(ob) {
      const r = ob.getBoundingClientRect();
      const p = playArea.getBoundingClientRect();
      return {
        left: r.left - p.left,
        top: r.top - p.top,
        right: r.right - p.left,
        bottom: r.bottom - p.top
      };
    }

    function collidesWithObstacle(rect) {
      return obstacles.some(ob => rectsOverlap(rect, obstacleRect(ob)));
    }

    function movePlayer() {
      if (!player) return;

      let x = parseFloat(player.style.left || 100);
      let y = parseFloat(player.style.top || 100);
      const speed = 4;

      let nextX = x;
      let nextY = y;

      if (keys["w"]) nextY -= speed;
      if (keys["s"]) nextY += speed;
      if (keys["a"]) nextX -= speed;
      if (keys["d"]) nextX += speed;

      const maxX = playArea.clientWidth - player.offsetWidth;
      const maxY = playArea.clientHeight - player.offsetHeight;

      nextX = Math.max(0, Math.min(maxX, nextX));
      nextY = Math.max(0, Math.min(maxY, nextY));

      const testRect = getRect(player, nextX, nextY);

      if (!collidesWithObstacle(testRect)) {
        player.style.left = nextX + "px";
        player.style.top = nextY + "px";
      }
    }

    function createAIBall() {
      aiBall = document.createElement("div");
      aiBall.id = "aiBall";

      sensor = document.createElement("div");
      sensor.id = "sensor";
      aiBall.appendChild(sensor);

      playArea.appendChild(aiBall);
    }

    function aiRectAt(x, y) {
      return {
        left: x,
        top: y,
        right: x + 40,
        bottom: y + 40
      };
    }

    function sensorRectAt(x, y) {
      return {
        left: x - 40,
        top: y - 40,
        right: x + 80,
        bottom: y + 80
      };
    }

    function aiTouchesObstacle(rect) {
      return obstacles.some(ob => rectsOverlap(rect, obstacleRect(ob)));
    }

    function aiSensorSeesObstacle(rect) {
      return obstacles.some(ob => rectsOverlap(rect, obstacleRect(ob)));
    }

    function pickNewDirection() {
      const dirs = [
        [2, 0], [-2, 0], [0, 2], [0, -2],
        [2, 2], [2, -2], [-2, 2], [-2, -2]
      ];

      for (let i = 0; i < 20; i++) {
        const d = dirs[Math.floor(Math.random() * dirs.length)];
        const testX = aiX + d[0] * 12;
        const testY = aiY + d[1] * 12;
        const testRect = aiRectAt(
          Math.max(0, Math.min(playArea.clientWidth - 40, testX)),
          Math.max(0, Math.min(playArea.clientHeight - 40, testY))
        );

        if (!aiSensorSeesObstacle(testRect)) {
          aiVX = d[0];
          aiVY = d[1];
          return;
        }
      }

      aiVX *= -1;
      aiVY *= -1;
    }

    function senseAndMoveAI() {
      if (!aiBall) return;

      const maxX = playArea.clientWidth - 40;
      const maxY = playArea.clientHeight - 40;

      const sensorRect = sensorRectAt(aiX + 20, aiY + 20);

      if (aiSensorSeesObstacle(sensorRect)) {
        pickNewDirection();
      }

      let nextX = aiX + aiVX;
      let nextY = aiY + aiVY;

      if (nextX <= 0 || nextX >= maxX) {
        aiVX *= -1;
        pickNewDirection();
      }

      if (nextY <= 0 || nextY >= maxY) {
        aiVY *= -1;
        pickNewDirection();
      }

      const nextRect = aiRectAt(nextX, nextY);

      if (aiTouchesObstacle(nextRect)) {
        pickNewDirection();
        nextX = aiX + aiVX;
        nextY = aiY + aiVY;
      }

      aiX = Math.max(0, Math.min(maxX, nextX));
      aiY = Math.max(0, Math.min(maxY, nextY));

      aiBall.style.left = aiX + "px";
      aiBall.style.top = aiY + "px";
    }

    createAIBall();

    function loop() {
      movePlayer();
      senseAndMoveAI();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
