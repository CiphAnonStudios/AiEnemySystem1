<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drag Drop AI Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #1b1b1b;
      overflow: hidden;
    }

    .wall {
      position: absolute;
      background: #555;
      z-index: 2;
    }

    #topWall {
      top: 0;
      left: 0;
      width: 100%;
      height: 20px;
    }

    #bottomWall {
      bottom: 120px;
      left: 0;
      width: 100%;
      height: 20px;
    }

    #leftWall {
      top: 0;
      left: 0;
      width: 20px;
      height: 100%;
    }

    #rightWall {
      top: 0;
      right: 0;
      width: 20px;
      height: 100%;
    }

    #playArea {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      bottom: 140px;
      overflow: hidden;
    }

    #panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 120px;
      background: #222;
      border-top: 2px solid #444;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      z-index: 10;
    }

    .tool {
      width: 70px;
      height: 70px;
      border: 2px solid white;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: black;
      user-select: none;
    }

    .rect-small { width: 40px; height: 25px; background: #ff5c5c; }
    .rect-medium { width: 60px; height: 35px; background: #ffd54a; }
    .rect-large { width: 90px; height: 50px; background: #4fc3f7; }
    .player-tool { width: 45px; height: 45px; background: limegreen; }
    .delete-box { width: 80px; height: 80px; background: #222; color: white; border: 2px dashed white; }

    .placed {
      position: absolute;
      z-index: 5;
    }

    #player {
      position: absolute;
      width: 45px;
      height: 45px;
      background: limegreen;
      border: 2px solid #0a0;
      z-index: 6;
    }

    #aiBall {
      position: absolute;
      width: 40px;
      height: 40px;
      background: deepskyblue;
      border-radius: 50%;
      z-index: 6;
    }

    #sensor {
      position: absolute;
      width: 120px;
      height: 120px;
      border: 2px dashed rgba(0,255,255,0.35);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-40px, -40px);
    }

    .placedRect {
      position: absolute;
      border: 2px solid rgba(255,255,255,0.8);
      z-index: 4;
    }

    #deleteZone {
      position: absolute;
      right: 20px;
      bottom: 150px;
      width: 100px;
      height: 100px;
      background: rgba(255, 0, 0, 0.25);
      border: 2px solid red;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 11;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="topWall" class="wall"></div>
    <div id="bottomWall" class="wall"></div>
    <div id="leftWall" class="wall"></div>
    <div id="rightWall" class="wall"></div>

    <div id="playArea"></div>

    <div id="deleteZone">DELETE</div>

    <div id="panel">
      <div class="tool rect-small" draggable="true" data-type="small"></div>
      <div class="tool rect-medium" draggable="true" data-type="medium"></div>
      <div class="tool rect-large" draggable="true" data-type="large"></div>
      <div class="tool player-tool" draggable="true" data-type="player"></div>
      <div class="tool delete-box" draggable="false">Delete</div>
    </div>
  </div>

  <script>
    const playArea = document.getElementById("playArea");
    const deleteZone = document.getElementById("deleteZone");
    const panel = document.getElementById("panel");

    let draggedType = null;
    let player = null;
    let aiBall = null;
    let aiX = 300;
    let aiY = 200;
    let aiVX = 2;
    let aiVY = 2;
    let keys = {};

    const wallColor = "rgb(85, 85, 85)";

    document.querySelectorAll("[draggable='true']").forEach(tool => {
      tool.addEventListener("dragstart", e => {
        draggedType = tool.dataset.type;
      });
    });

    playArea.addEventListener("dragover", e => e.preventDefault());

    playArea.addEventListener("drop", e => {
      e.preventDefault();
      const rect = playArea.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (draggedType === "small" || draggedType === "medium" || draggedType === "large") {
        createRectangle(draggedType, x, y);
      }

      if (draggedType === "player") {
        if (!player) {
          player = document.createElement("div");
          player.id = "player";
          playArea.appendChild(player);
        }
        player.style.left = x + "px";
        player.style.top = y + "px";
      }

      draggedType = null;
    });

    function createRectangle(type, x, y) {
      const div = document.createElement("div");
      div.className = "placedRect placed";
      div.draggable = true;

      if (type === "small") {
        div.style.width = "40px";
        div.style.height = "25px";
        div.style.background = "#ff5c5c";
      } else if (type === "medium") {
        div.style.width = "60px";
        div.style.height = "35px";
        div.style.background = "#ffd54a";
      } else {
        div.style.width = "90px";
        div.style.height = "50px";
        div.style.background = "#4fc3f7";
      }

      div.style.left = x + "px";
      div.style.top = y + "px";

      div.addEventListener("dragstart", e => {
        draggedElement = div;
      });

      playArea.appendChild(div);
    }

    let draggedElement = null;

    playArea.addEventListener("dragstart", e => {
      if (e.target.classList.contains("placedRect")) {
        draggedElement = e.target;
      }
    });

    playArea.addEventListener("dragend", e => {
      draggedElement = null;
    });

    playArea.addEventListener("dragover", e => {
      e.preventDefault();
    });

    playArea.addEventListener("drop", e => {
      e.preventDefault();
      const rect = playArea.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (draggedElement) {
        const w = draggedElement.offsetWidth;
        const h = draggedElement.offsetHeight;
        draggedElement.style.left = (x - w / 2) + "px";
        draggedElement.style.top = (y - h / 2) + "px";

        const zone = deleteZone.getBoundingClientRect();
        const elRect = draggedElement.getBoundingClientRect();

        if (
          elRect.left < zone.right &&
          elRect.right > zone.left &&
          elRect.top < zone.bottom &&
          elRect.bottom > zone.top
        ) {
          draggedElement.remove();
        }
      }
    });

    document.addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
    });

    document.addEventListener("keyup", e => {
      keys[e.key.toLowerCase()] = false;
    });

    function movePlayer() {
      if (!player) return;

      let x = parseFloat(player.style.left || 100);
      let y = parseFloat(player.style.top || 100);
      const speed = 4;

      if (keys["w"]) y -= speed;
      if (keys["s"]) y += speed;
      if (keys["a"]) x -= speed;
      if (keys["d"]) x += speed;

      const maxX = playArea.clientWidth - player.offsetWidth;
      const maxY = playArea.clientHeight - player.offsetHeight;

      x = Math.max(0, Math.min(maxX, x));
      y = Math.max(0, Math.min(maxY, y));

      player.style.left = x + "px";
      player.style.top = y + "px";
    }

    function createAIBall() {
      aiBall = document.createElement("div");
      aiBall.id = "aiBall";
      playArea.appendChild(aiBall);

      const sensor = document.createElement("div");
      sensor.id = "sensor";
      aiBall.appendChild(sensor);
    }

    function senseWallsAndMove() {
      if (!aiBall) return;

      const maxX = playArea.clientWidth - aiBall.offsetWidth;
      const maxY = playArea.clientHeight - aiBall.offsetHeight;

      const nextX = aiX + aiVX;
      const nextY = aiY + aiVY;

      if (nextX <= 0 || nextX >= maxX) {
        aiVX *= -1;
      }

      if (nextY <= 0 || nextY >= maxY) {
        aiVY *= -1;
      }

      aiX += aiVX;
      aiY += aiVY;

      aiBall.style.left = aiX + "px";
      aiBall.style.top = aiY + "px";
    }

    createAIBall();

    function gameLoop() {
      movePlayer();
      senseWallsAndMove();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
