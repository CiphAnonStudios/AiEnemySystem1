<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green Square Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      background: #222;
    }

    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 10;
      font-size: 16px;
      line-height: 1.5;
      user-select: none;
    }

    #msg {
      margin-top: 8px;
      font-size: 18px;
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>Coins: <span id="coinCount">0</span>/<span id="coinTotal">0</span></div>
    <div>Ability: <span id="abilityText">Ready</span></div>
    <div id="msg"></div>
  </div>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const coinCountEl = document.getElementById("coinCount");
    const coinTotalEl = document.getElementById("coinTotal");
    const abilityText = document.getElementById("abilityText");
    const msg = document.getElementById("msg");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const keys = {};
    window.addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === " " || e.key.toLowerCase() === "shift") {
        useAbility();
      }
    });
    window.addEventListener("keyup", e => {
      keys[e.key.toLowerCase()] = false;
    });

    const player = {
      x: 80,
      y: 80,
      size: 30,
      speed: 3,
      color: "lime",
      dashSpeed: 8,
      dashTime: 0,
      dashCooldown: 0,
      invisibleTime: 0,
      lives: 1
    };

    const enemy = {
      x: 600,
      y: 350,
      size: 30,
      speed: 2.4,
      color: "red",
      sensorRadius: 150
    };

    const door = {
      x: 900,
      y: 500,
      w: 45,
      h: 70,
      open: false
    };

    const walls = [
      { x: 0, y: 0, w: canvas.width, h: 20 },
      { x: 0, y: canvas.height - 20, w: canvas.width, h: 20 },
      { x: 0, y: 0, w: 20, h: canvas.height },
      { x: canvas.width - 20, y: 0, w: 20, h: canvas.height },

      { x: 120, y: 120, w: 220, h: 20 },
      { x: 120, y: 120, w: 20, h: 180 },
      { x: 300, y: 220, w: 20, h: 180 },
      { x: 420, y: 150, w: 20, h: 240 },
      { x: 520, y: 80, w: 200, h: 20 },
      { x: 620, y: 80, w: 20, h: 220 },
      { x: 760, y: 180, w: 220, h: 20 },
      { x: 760, y: 180, w: 20, h: 220 },
      { x: 920, y: 300, w: 20, h: 180 },
      { x: 150, y: 420, w: 240, h: 20 },
      { x: 220, y: 500, w: 20, h: 160 },
      { x: 350, y: 560, w: 260, h: 20 }
    ];

    const coins = [
      { x: 80, y: 200, r: 8, taken: false },
      { x: 240, y: 340, r: 8, taken: false },
      { x: 460, y: 260, r: 8, taken: false },
      { x: 640, y: 140, r: 8, taken: false },
      { x: 820, y: 260, r: 8, taken: false },
      { x: 980, y: 420, r: 8, taken: false }
    ];

    coinTotalEl.textContent = coins.length;

    function rectHit(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.size > b.x &&
        a.y < b.y + b.h &&
        a.y + a.size > b.y
      );
    }

    function circleRectHit(cx, cy, r, rect) {
      const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
      const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
      const dx = cx - closestX;
      const dy = cy - closestY;
      return dx * dx + dy * dy < r * r;
    }

    function drawPlayer() {
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.size, player.size);
    }

    function drawEnemy() {
      ctx.fillStyle = enemy.color;
      ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);

      ctx.beginPath();
      ctx.arc(enemy.x + enemy.size / 2, enemy.y + enemy.size / 2, enemy.sensorRadius, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255, 0, 0, 0.15)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawWalls() {
      ctx.fillStyle = "gray";
      walls.forEach(w => {
        ctx.fillRect(w.x, w.y, w.w, w.h);
      });
    }

    function drawCoins() {
      coins.forEach(c => {
        if (!c.taken) {
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
          ctx.fillStyle = "gold";
          ctx.fill();
        }
      });
    }

    function drawDoor() {
      ctx.fillStyle = door.open ? "cyan" : "#444";
      ctx.fillRect(door.x, door.y, door.w, door.h);
    }

    function moveWithCollision(obj, dx, dy) {
      let nextX = obj.x + dx;
      let nextY = obj.y + dy;

      const testX = { x: nextX, y: obj.y, size: obj.size };
      for (const wall of walls) {
        if (rectHit(testX, wall)) {
          nextX = obj.x;
          break;
        }
      }

      const testY = { x: nextX, y: nextY, size: obj.size };
      for (const wall of walls) {
        if (rectHit(testY, wall)) {
          nextY = obj.y;
          break;
        }
      }

      obj.x = nextX;
      obj.y = nextY;
    }

    function canSeePlayer() {
      const px = player.x + player.size / 2;
      const py = player.y + player.size / 2;
      const ex = enemy.x + enemy.size / 2;
      const ey = enemy.y + enemy.size / 2;

      const dx = px - ex;
      const dy = py - ey;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > enemy.sensorRadius) return false;

      const steps = Math.ceil(dist / 10);
      for (let i = 1; i <= steps; i++) {
        const x = ex + (dx * i) / steps;
        const y = ey + (dy * i) / steps;
        for (const wall of walls) {
          if (x > wall.x && x < wall.x + wall.w && y > wall.y && y < wall.y + wall.h) {
            return false;
          }
        }
      }
      return true;
    }

    function enemyMove() {
      const ex = enemy.x + enemy.size / 2;
      const ey = enemy.y + enemy.size / 2;
      const px = player.x + player.size / 2;
      const py = player.y + player.size / 2;

      let dx = 0;
      let dy = 0;

      if (canSeePlayer()) {
        const angle = Math.atan2(py - ey, px - ex);
        dx = Math.cos(angle) * enemy.speed;
        dy = Math.sin(angle) * enemy.speed;
      } else {
        const angle = performance.now() / 1000;
        dx = Math.cos(angle) * 1.2;
        dy = Math.sin(angle * 0.8) * 1.2;
      }

      moveWithCollision(enemy, dx, dy);
    }

    function useAbility() {
      if (player.dashCooldown > 0 || player.invisibleTime > 0) return;

      player.invisibleTime = 120;
      player.dashCooldown = 240;
      msg.textContent = "Invisible for 2 seconds!";
      setTimeout(() => {
        msg.textContent = "";
      }, 1000);
    }

    function updatePlayer() {
      let speed = player.speed;

      if (player.dashTime > 0) {
        speed = player.dashSpeed;
        player.dashTime--;
      }

      if (player.invisibleTime > 0) {
        player.invisibleTime--;
      }

      if (player.dashCooldown > 0) {
        player.dashCooldown--;
      }

      if (keys[" "] || keys["shift"]) {
        if (player.dashCooldown === 0 && player.dashTime === 0) {
          player.dashTime = 12;
          player.dashCooldown = 180;
        }
      }

      let dx = 0;
      let dy = 0;

      if (keys["arrowup"] || keys["w"]) dy -= speed;
      if (keys["arrowdown"] || keys["s"]) dy += speed;
      if (keys["arrowleft"] || keys["a"]) dx -= speed;
      if (keys["arrowright"] || keys["d"]) dx += speed;

      moveWithCollision(player, dx, dy);
    }

    function collectCoins() {
      let count = 0;
      coins.forEach(c => {
        if (!c.taken) {
          const cx = c.x;
          const cy = c.y;
          if (
            player.x < cx + c.r &&
            player.x + player.size > cx - c.r &&
            player.y < cy + c.r &&
            player.y + player.size > cy - c.r
          ) {
            c.taken = true;
          }
        }
        if (c.taken) count++;
      });

      coinCountEl.textContent = count;
      if (count === coins.length) {
        door.open = true;
      }
    }

    function checkDeath() {
      if (player.invisibleTime > 0) return;

      if (rectHit(player, enemy)) {
        msg.textContent = "You died! Refresh to restart.";
        gameOver = true;
      }
    }

    function checkWin() {
      if (!door.open) return;

      if (
        player.x < door.x + door.w &&
        player.x + player.size > door.x &&
        player.y < door.y + door.h &&
        player.y + player.size > door.y
      ) {
        msg.textContent = "You win!";
        gameOver = true;
      }
    }

    let gameOver = false;

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawWalls();
      drawCoins();
      drawDoor();

      if (!gameOver) {
        updatePlayer();
        enemyMove();
        collectCoins();
        checkDeath();
        checkWin();
      }

      drawPlayer();
      drawEnemy();

      if (player.invisibleTime > 0) {
        ctx.beginPath();
        ctx.arc(player.x + player.size / 2, player.y + player.size / 2, 20, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(0,255,255,0.8)";
        ctx.lineWidth = 2;
        ctx.stroke();
        abilityText.textContent = "Invisible";
      } else if (player.dashCooldown > 0) {
        abilityText.textContent = "Cooldown";
      } else {
        abilityText.textContent = "Ready";
      }

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
